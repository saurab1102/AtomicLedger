spring:
  application:
    name: atomicledger
  datasource:
    url: ${ATOMICLEDGER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atomicledger}
    username: ${ATOMICLEDGER_DATASOURCE_USERNAME:atomicledger}
    password: ${ATOMICLEDGER_DATASOURCE_PASSWORD:atomicledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
